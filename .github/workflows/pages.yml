name: Deploy 2026 to GitHub Pages

on:
  push:
    branches: [deploy/year-path]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate static site with Discord staff data
        run: |
          : "${DISCORD_BOT_TOKEN:?Set the DISCORD_BOT_TOKEN GitHub Actions secret}"
          : "${DISCORD_GUILD_ID:?Set the DISCORD_GUILD_ID GitHub Actions secret}"
          npm run generate
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          NUXT_APP_BASE_URL: /2026/
          NUXT_I18N_BASE_URL: https://twbronycon.org
      - run: test -s .output/public/404.html && test -s .output/public/sitemap.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
